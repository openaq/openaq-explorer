name: Bundle size

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle-size:
    name: Compare bundle size
    runs-on: ubuntu-24.04-arm
    env:
      VITE_SESSION_SECRET: placeholder
      VITE_HMAC_SECRET: placeholder
      VITE_API_BASE_URL: https://api.example.com
      VITE_MAP_STYLE: placeholder
      VITE_TILES_URL: https://tiles.example.com
      VITE_TILES_API_KEY: placeholder
      VITE_EXPLORER_API_KEY: placeholder
      VITE_GEOCODE_URL: https://geocode.example.com
      VITE_GEOCODE_API_KEY: placeholder
      VITE_ENV: prod
      VITE_SHOW_NOTIFICATION: false
      VITE_REGISTRATION_DISABLED: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # 2.10.0
        with:
          install-script: pnpm install --frozen-lockfile
          build-script: build
          pattern: ".output/public/**/*.{js,css,html}"
          strip-hash: "-([a-zA-Z0-9_-]{8})\\."
          compression: gzip
          minimum-change-threshold: 100
